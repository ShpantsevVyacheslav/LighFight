<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LighFight — горизонтальный экран телефона</title><style>*{box-sizing:border-box}body{margin:0;background:#060709;min-height:100vh;display:grid;place-content:center;font:12px sans-serif;color:#777b7d}.phone{width:min(932px,calc(100vw - 24px));aspect-ratio:932/430;overflow:hidden;border-radius:22px;box-shadow:0 0 0 1px #353839,0 25px 80px #000}iframe{display:block;width:932px;height:430px;border:0;transform-origin:top left;transform:scale(var(--scale,1))}p{text-align:center;letter-spacing:1px;margin-top:20px}</style><div class="phone"><iframe src="index.html" title="Мобильный экран выбора бойца"></iframe></div><p>932 × 430 · LIGHFIGHT</p><script>const phone=document.querySelector('.phone');new ResizeObserver(()=>phone.style.setProperty('--scale',phone.clientWidth/932)).observe(phone);</script></html>
